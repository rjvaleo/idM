name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.9.0-alpha"
        required: true

permissions:
  contents: write

env:
  WEBVIEW2_VERSION: 1.0.3485.44

jobs:
  ui:
    name: UI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A release is not the place to discover the gates are red.
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:manual
      - run: npm run goldens:check

      - run: npm run build:single

      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: dist-single/index.html
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            asset: idM-macOS-universal
          - name: Windows
            os: windows-2022
            asset: idM-Windows-x64
          - name: Linux
            os: ubuntu-22.04
            asset: idM-Linux-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: dist-single

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libwebkit2gtk-4.1-dev

      - name: WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Register-PackageSource -Provider NuGet -Name nugetRepository `
            -Location https://www.nuget.org/api/v2 -Force | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser `
            -RequiredVersion $env:WEBVIEW2_VERSION -Source nugetRepository -Force | Out-Null

      - name: Build
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build --config Release -j 4

      - name: Engine conformance
        shell: bash
        run: |
          BIN=$(find plugin/build -name 'IdmConformance*' -type f -perm -u+x | head -1)
          "$BIN"

      - name: Engine conformance, x86_64 slice
        if: runner.os == 'macOS'
        run: arch -x86_64 plugin/build/IdmConformance

      - name: Validate the Audio Units
        if: runner.os == 'macOS'
        run: |
          auval -v aumu idMa Rjvl
          auval -v aumi idMm Rjvl

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          OUT="staging/${{ matrix.asset }}"
          mkdir -p "$OUT"
          ART=plugin/build/IdmPlugin_artefacts/Release
          MIDI_ART=plugin/build/IdmMidiPlugin_artefacts/Release

          copy() { [ -e "$1" ] && cp -R "$1" "$OUT/" && echo "  + $(basename "$1")" || true; }

          echo "collecting for $RUNNER_OS:"
          copy "$ART/VST3/idM.vst3"
          copy "$ART/CLAP/idM.clap"

          if [ "$RUNNER_OS" = "macOS" ]; then
            copy "$ART/AU/idM.component"
            copy "$MIDI_ART/AU/idM MIDI.component"
            copy "$ART/Standalone/idM.app"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            copy "$ART/Standalone/idM.exe"
          else
            copy "$ART/Standalone/idM"
          fi

          cp LICENSE "$OUT/"
          cp README.md "$OUT/"

      # Written per-platform because the install paths and the first-run
      # friction are genuinely different, and a single generic file would be
      # wrong on two of the three.
      - name: Install notes
        shell: bash
        run: |
          OUT="staging/${{ matrix.asset }}"
          {
            echo "idM ${{ github.event.inputs.tag || github.ref_name }}"
            echo
            echo "These builds are NOT code-signed or notarised."
            echo
            case "$RUNNER_OS" in
              macOS)
                echo "Copy into:"
                echo "  idM.component, idM MIDI.component -> ~/Library/Audio/Plug-Ins/Components/"
                echo "  idM.vst3                          -> ~/Library/Audio/Plug-Ins/VST3/"
                echo "  idM.clap                          -> ~/Library/Audio/Plug-Ins/CLAP/"
                echo "  idM.app                           -> /Applications/"
                echo
                echo "Because the download is quarantined and unsigned, macOS will refuse"
                echo "to load it until you clear that flag. From Terminal, in this folder:"
                echo "  xattr -dr com.apple.quarantine ."
                echo
                echo "Universal: Apple Silicon and Intel. Requires macOS 11 or later."
                ;;
              Windows)
                echo "Copy into:"
                echo "  idM.vst3 -> C:\\\\Program Files\\\\Common Files\\\\VST3\\\\"
                echo "  idM.clap -> C:\\\\Program Files\\\\Common Files\\\\CLAP\\\\"
                echo "  idM.exe  -> anywhere you like"
                echo
                echo "idM's interface renders in Microsoft Edge WebView2. It ships with"
                echo "current Windows; if the plugin window is blank, install the"
                echo "'Microsoft Edge WebView2 Runtime' (Evergreen) from Microsoft and"
                echo "reopen it. idM writes which engine it got to its log."
                ;;
              Linux)
                echo "Copy into:"
                echo "  idM.vst3 -> ~/.vst3/"
                echo "  idM.clap -> ~/.clap/"
                echo "  idM      -> anywhere on your PATH"
                echo
                echo "Needs libwebkit2gtk (4.1 or 4.0) at runtime for the interface."
                ;;
            esac
            echo
            echo "Getting MIDI out of it, and which hosts are known to work, are in"
            echo "README.md and HOSTS.md. Please report what you find:"
            echo "https://github.com/rjvaleo/idM/issues"
          } > "$OUT/INSTALL.txt"
          cat "$OUT/INSTALL.txt"

      - name: Package
        shell: bash
        run: |
          cd staging
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          else
            # ditto on macOS preserves the bundle symlinks that make a .component
            # loadable; zip -r does not.
            if [ "$RUNNER_OS" = "macOS" ]; then
              ditto -c -k --sequesterRsrc --keepParent "${{ matrix.asset }}" "${{ matrix.asset }}.zip"
            else
              7z a -tzip "${{ matrix.asset }}.zip" "${{ matrix.asset }}"
            fi
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            staging/*.zip
            staging/*.tar.gz

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Checksums
        run: |
          mkdir -p release
          find downloads -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: idM ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release/*
          body: |
            **Alpha.** Not code-signed or notarised. Every archive carries an
            `INSTALL.txt` with the paths for that platform and the one extra step
            macOS needs.

            | Platform | Formats |
            |---|---|
            | macOS (universal, 11+) | AU, AU MIDI FX, VST3, CLAP, Standalone |
            | Windows (x64) | VST3, CLAP, Standalone |
            | Linux (x86_64) | VST3, CLAP, Standalone |

            Getting MIDI *out* of it takes one routing step in most hosts — see
            [Getting MIDI out of it](https://github.com/rjvaleo/idM#getting-midi-out-of-it).

            Please report what you find, including hosts where it does not work:
            https://github.com/rjvaleo/idM/issues

            `SHA256SUMS.txt` covers every archive here.
